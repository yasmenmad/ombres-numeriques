<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="30" fill="url(#beaconGlow)"/>
  <circle cx="32" cy="32" r="29" stroke="url(#neonGlow)" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Concentric Radar Rings -->
  <circle cx="32" cy="32" r="22" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="32" cy="32" r="14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  
  <!-- Crosshairs / Compass Axes -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>

  <!-- Core Octagonal Topo Node -->
  <polygon points="32,18 42,22 46,32 42,42 32,46 22,42 18,32 22,22" fill="#0C101A" stroke="#10B981" stroke-width="2"/>
  
  <!-- Center Satellite Beacon -->
  <circle cx="32" cy="32" r="4.5" fill="#10B981"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
