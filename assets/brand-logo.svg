<svg width="420" height="72" viewBox="0 0 420 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGlow" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="beaconRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left Icon Radar -->
  <g transform="translate(6, 6)">
    <circle cx="30" cy="30" r="28" fill="url(#beaconRadial)"/>
    <circle cx="30" cy="30" r="26" stroke="url(#brandGlow)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="30" cy="30" r="18" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="30" cy="30" r="10" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <line x1="30" y1="4" x2="30" y2="56" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
    <line x1="4" y1="30" x2="56" y2="30" stroke="rgba(56,189,248,0.35)" stroke-width="1"/>
    <polygon points="30,16 40,20 44,30 40,40 30,44 20,40 16,30 20,20" fill="#0C101A" stroke="#10B981" stroke-width="1.8"/>
    <circle cx="30" cy="30" r="3.5" fill="#10B981"/>
    <circle cx="30" cy="30" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 16)">
    <text x="0" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">DIGITAL SHADOWS</text>
    <text x="0" y="37" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981" letter-spacing="1.5">OMBRES NUMÉRIQUES &middot; SPATIAL GIS</text>
  </g>
