    <text x="24" y="224" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#8b5cf6">POLICY SYNTHESIS</text>
    <text x="24" y="244" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">Google Gemini AI Engine</text>
    <text x="24" y="260" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Automated territorial planning</text>
    <rect x="24" y="272" width="167" height="42" rx="4" fill="rgba(139,92,246,0.08)"/>
    <text x="30" y="288" font-family="sans-serif" font-size="9" fill="#c4b5fd">&bull; Solar satellite base-stations</text>
    <text x="30" y="302" font-family="sans-serif" font-size="9" fill="#c4b5fd">&bull; Mobile health clinic routing</text>
    <text x="24" y="336" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Provincial action matrix output</text>
