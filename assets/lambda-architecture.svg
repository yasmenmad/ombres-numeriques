    <text x="24" y="110" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Vector choropleths</text>
    <text x="24" y="126" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Dynamic opacity &amp; zoom</text>
    <rect x="24" y="138" width="147" height="24" rx="4" fill="rgba(99,102,241,0.1)"/>
    <text x="30" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">map.html (Live WebGL)</text>

    <!-- Analytics Dashboard -->
    <rect x="14" y="202" width="167" height="152" rx="8" fill="#111827" stroke="rgba(99,102,241,0.2)"/>
    <text x="24" y="224" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818cf8">ANALYTICS CONSOLE</text>
    <text x="24" y="244" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">Provincial Dashboards</text>
    <text x="24" y="260" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Chart.js multi-axial metrics</text>
    <text x="24" y="276" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Vulnerability rank table</text>
    <rect x="24" y="292" width="147" height="24" rx="4" fill="rgba(16,185,129,0.1)"/>
    <text x="30" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">dashboard.html (Live)</text>
    <text x="24" y="336" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">REST API: /api/regions</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 480)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">AUTHOR: YASMINE DAOUDI &middot; RESEARCH &amp; BIG DATA ENGINEERING &middot; DOI: 10.5281/zenodo.23963589</text>
    <text x="760" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">&check; 450,000 SPATIAL CELLS INDEXED</text>
