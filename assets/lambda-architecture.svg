    <text x="24" y="74" font-family="sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Morocco 1 km²</text>
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8">450,000 Spatial</text>
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Hex Grid Vectors</text>
    <text x="24" y="124" font-family="sans-serif" font-size="9" fill="#64748b">Sentinel-2 &middot; OSM</text>

