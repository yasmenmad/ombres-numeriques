    <text x="24" y="304" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Network Probes</text>
    <text x="24" y="324" font-family="sans-serif" font-size="9" fill="#64748b">4G / 5G Tower Ping</text>
